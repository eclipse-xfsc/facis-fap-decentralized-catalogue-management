{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dcm.fullname" . }}
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | quote }}
            pathType: {{ .Values.ingress.pathType }}
            backend:
              service:
                name: {{ include "dcm.fullname" . }}
                port:
                  name: app
{{- end }}
{{- if and .Values.ingress.enabled .Values.filebrowserIngress.enabled }}
---
{{- end }}
{{- if .Values.filebrowserIngress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dcm.fullname" . }}-filebrowser
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
  {{- with .Values.filebrowserIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.filebrowserIngress.className | quote }}
  {{- with .Values.filebrowserIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.filebrowserIngress.host | quote }}
      http:
        paths:
          - path: {{ .Values.filebrowserIngress.path | quote }}
            pathType: {{ .Values.filebrowserIngress.pathType }}
            backend:
              service:
                name: {{ include "dcm.fullname" . }}
                port:
                  name: filebrowser
{{- end }}
