{{- if not .Values.secret.existingSecret }}
{{- $kms := required "secret.dcmKmsKey is required when secret.existingSecret is empty" .Values.secret.dcmKmsKey }}
{{- $mongoUri := required "secret.mongoUri is required when secret.existingSecret is empty" .Values.secret.mongoUri }}
{{- if not (regexMatch "^[0-9a-fA-F]{64}$" $kms) }}
{{- fail "secret.dcmKmsKey must contain exactly 64 hexadecimal characters" }}
{{- end }}
{{- if eq (lower $kms) (repeat 64 "0") }}
{{- fail "secret.dcmKmsKey must not use the all-zero placeholder" }}
{{- end }}
{{- if regexMatch "(?i)(CHANGE_ME|PASSWORD_PLACEHOLDER|REPLACE_ME)" $mongoUri }}
{{- fail "secret.mongoUri still contains a placeholder value" }}
{{- end }}
{{- if not (regexMatch "^mongodb(\\+srv)?://" $mongoUri) }}
{{- fail "secret.mongoUri must start with mongodb:// or mongodb+srv://" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dcm.secretName" . }}
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
type: Opaque
stringData:
  dcm-kms-key: {{ $kms | quote }}
  mongo-uri: {{ $mongoUri | quote }}
{{- end }}
