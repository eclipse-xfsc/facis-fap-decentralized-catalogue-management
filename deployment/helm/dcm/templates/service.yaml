apiVersion: v1
kind: Service
metadata:
  name: {{ include "dcm.fullname" . }}
  labels:
    {{- include "dcm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "dcm.selectorLabels" . | nindent 4 }}
  ports:
    - name: app
      port: {{ .Values.service.ports.app }}
      targetPort: app
      protocol: TCP
    - name: filebrowser
      port: {{ .Values.service.ports.filebrowser }}
      targetPort: filebrowser
      protocol: TCP
