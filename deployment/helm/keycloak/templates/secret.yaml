{{- if not .Values.secret.existingSecret }}
{{- $adminPassword := required "secret.adminPassword is required when secret.existingSecret is empty" .Values.secret.adminPassword }}
{{- $databasePassword := required "secret.database.password is required when secret.existingSecret is empty" .Values.secret.database.password }}
{{- if regexMatch "(?i)(CHANGE_ME|PASSWORD_PLACEHOLDER|REPLACE_ME)" $adminPassword }}
{{- fail "secret.adminPassword still contains a placeholder value" }}
{{- end }}
{{- if regexMatch "(?i)(CHANGE_ME|PASSWORD_PLACEHOLDER|REPLACE_ME)" $databasePassword }}
{{- fail "secret.database.password still contains a placeholder value" }}
{{- end }}
{{- if lt (len $adminPassword) 12 }}
{{- fail "secret.adminPassword must be at least 12 characters" }}
{{- end }}
{{- if lt (len $databasePassword) 12 }}
{{- fail "secret.database.password must be at least 12 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.secretName" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  keycloak-admin-user: {{ required "secret.adminUser is required" .Values.secret.adminUser | quote }}
  keycloak-admin-password: {{ $adminPassword | quote }}
  keycloak-db-username: {{ required "secret.database.username is required" .Values.secret.database.username | quote }}
  keycloak-db-password: {{ $databasePassword | quote }}
  keycloak-db-database: {{ required "secret.database.database is required" .Values.secret.database.database | quote }}
{{- end }}
