{{- if not .Values.secret.existingSecret }}
{{- $rootPassword := required "secret.rootPassword is required when secret.existingSecret is empty" .Values.secret.rootPassword }}
{{- $password := required "secret.password is required when secret.existingSecret is empty" .Values.secret.password }}
{{- if regexMatch "(?i)(CHANGE_ME|PASSWORD_PLACEHOLDER|REPLACE_ME)" $rootPassword }}
{{- fail "secret.rootPassword still contains a placeholder value" }}
{{- end }}
{{- if regexMatch "(?i)(CHANGE_ME|PASSWORD_PLACEHOLDER|REPLACE_ME)" $password }}
{{- fail "secret.password still contains a placeholder value" }}
{{- end }}
{{- if lt (len $rootPassword) 12 }}
{{- fail "secret.rootPassword must be at least 12 characters" }}
{{- end }}
{{- if lt (len $password) 12 }}
{{- fail "secret.password must be at least 12 characters" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb.secretName" . }}
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  mongo-root-username: {{ required "secret.rootUsername is required" .Values.secret.rootUsername | quote }}
  mongo-root-password: {{ $rootPassword | quote }}
  mongo-username: {{ required "secret.username is required" .Values.secret.username | quote }}
  mongo-password: {{ $password | quote }}
  mongo-database: {{ required "secret.database is required" .Values.secret.database | quote }}
{{- end }}
