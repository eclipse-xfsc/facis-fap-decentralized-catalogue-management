apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mongodb.fullname" . }}-init
  labels:
    {{- include "mongodb.labels" . | nindent 4 }}
data:
  01-create-application-user.js: |
    const databaseName = process.env.MONGO_INITDB_DATABASE;
    const username = process.env.MONGO_APP_USERNAME;
    const password = process.env.MONGO_APP_PASSWORD;
    const applicationDb = db.getSiblingDB(databaseName);

    if (applicationDb.getUser(username) === null) {
      applicationDb.createUser({
        user: username,
        pwd: password,
        roles: [{ role: "readWrite", db: databaseName }]
      });
    }
